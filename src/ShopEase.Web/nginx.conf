server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # ── API reverse proxy ────────────────────────────────────────────
    # "api" is the compose service name. Docker's embedded DNS resolves it
    # to that container's IP on shopease-net. This is why the browser can
    # call a relative /api/... and never needs to know the API's address —
    # and why there is no CORS: everything is one origin.
    #
    # No trailing slash on proxy_pass, so the original /api/ prefix is kept:
    #   /api/products  →  http://api:8080/api/products
    location /api/ {
        proxy_pass       http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Hashed build assets are immutable — cache them hard ──────────
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    # Angular owns routing. A hard refresh on /catalog or /admin/orders
    # must return index.html, not a 404, so the router can take over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
