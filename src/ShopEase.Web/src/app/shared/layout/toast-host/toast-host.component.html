<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
  @for (t of toastSvc.toasts(); track t.id) {
    <div class="toast show align-items-center text-white border-0" [style.background-color]="colorFor(t.type)" role="alert">
      <div class="d-flex">
        <div class="toast-body"><i class="bi" [class]="iconFor(t.type)"></i> {{ t.message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastSvc.dismiss(t.id)"></button>
      </div>
    </div>
  }

  @for (c of toastSvc.confirmToasts(); track c.id) {
    <div class="toast show border-0" [style.background-color]="confirmColorFor(c.type)" style="min-width: 320px;" role="alert">
      <div class="toast-body" [class.text-dark]="c.type === 'warning'" [class.text-white]="c.type !== 'warning'">
        <div class="fw-bold mb-2"><i class="bi bi-exclamation-triangle-fill"></i> Confirmation Required</div>
        <p class="mb-3 small">{{ c.message }}</p>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-sm btn-light" (click)="c.resolve(false)">Cancel</button>
          <button class="btn btn-sm btn-danger" (click)="c.resolve(true)">Confirm</button>
        </div>
      </div>
    </div>
  }
</div>
